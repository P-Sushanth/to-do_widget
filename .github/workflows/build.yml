name: Build Windows Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Native Windows Executable (~2 MB)
        shell: powershell
        run: |
          .\build_native.ps1
          Compress-Archive -Path dist-native\*, install-native.bat, install-native.ps1, uninstall-native.bat, uninstall-native.ps1 -DestinationPath Desktop-To-Do-Widget-Native.zip -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Installer and Portable Executables
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-To-Do-Widget-Windows
          path: |
            Desktop-To-Do-Widget-Native.zip
            dist-native/DesktopToDoWidget.exe
            dist/*.exe
            !dist/*__uninstaller.exe

      - name: Determine Release Tag
        id: release_tag
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $tag = "v1.1.0"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Desktop To-Do Widget ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## Desktop To-Do Widget ${{ steps.release_tag.outputs.tag }} 📌

            Ultra-lightweight, zero-latency desktop To-Do widget for Windows 10 & 11 designed to live natively on your wallpaper plane.

            ### 🌟 Key Features in this Release:
            - **⚡ Ultra-Small App Size (~2 MB) & Featherweight RAM (~35 MB)**: Powered by native Windows Edge WebView2. 99.3% smaller disk footprint and 75% lower RAM usage compared to traditional Electron apps.
            - **🎨 Full-Spectrum Color & Theme Studio**: 2D Saturation/Value box, 360° rainbow hue slider, shade/lightness slider, eyedropper, presets, and dynamic smart contrast shade adaptation for all buttons and accents.
            - **🧲 Magnetic Flush Snapping**: 0px offset flush snapping against display boundaries and 4 corners with 1-click corner pinning.
            - **📐 Real-Time Edge & Corner Resizing**: 8-directional border and corner dragging with visual corner grip indicator.
            - **🪟 Desktop Homescreen Persistence**: Stays on the desktop background plane with full immunity to <kbd>Win</kbd> + <kbd>D</kbd> (*Show Desktop*).

            ---

            ### 📥 Download Options:

            #### ⭐ Recommended: Native Windows Edition (~1.5 MB)
            - **`Desktop-To-Do-Widget-Native.zip`** (**1.56 MB**)
              - **How to install:** Download, extract anywhere, and double-click `install-native.bat` (or run `DesktopToDoWidget.exe` directly as a portable app).
              - **RAM usage:** ~35–45 MB (single native process)
              - **Disk footprint:** ~2.2 MB total

            #### 📦 Electron Edition (Legacy / Developers)
            - **`Desktop To-Do Widget Setup 1.1.0.exe`** — Traditional Electron NSIS installer (~122 MB).
            - **`Desktop-To-Do-Widget-Portable.exe`** — Traditional Electron standalone portable executable (~111 MB).
          files: |
            Desktop-To-Do-Widget-Native.zip
            dist-native/DesktopToDoWidget.exe
            dist/*.exe
            !dist/*__uninstaller.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
