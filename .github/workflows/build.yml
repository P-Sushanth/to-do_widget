name: Build Windows Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Installer and Portable Executables
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-To-Do-Widget-Windows
          path: |
            dist/*.exe
            !dist/*__uninstaller.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Desktop To-Do Widget v1.0.0"
          body: |
            ## Desktop To-Do Widget v1.0.0 📌

            Zero-latency, pitch-black desktop To-Do widget for Windows 11 designed to live natively on your wallpaper plane.

            ### 📥 Download Prebuilt Executables:
            - **`Desktop To-Do Widget Setup 1.0.0.exe`** — Standard Windows installer. Automatically adds Desktop and Start Menu shortcuts with icon.
            - **`Desktop-To-Do-Widget-Portable.exe`** — Standalone portable executable. No installation needed; run anywhere.
          files: |
            dist/*.exe
            !dist/*__uninstaller.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
